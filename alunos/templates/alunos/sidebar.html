{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Escola Militar Tiradentes{% endblock %}</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      display: flex; min-height: 100vh;
      background-color: #0d1117;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #e0e0e0;
    }
    .sidebar {
      width: 220px; min-height: 100vh;
      background: linear-gradient(180deg, #0a0f2c 0%, #0d1117 100%);
      display: flex; flex-direction: column; align-items: center;
      padding: 32px 0 24px; position: fixed;
      left: 0; top: 0; bottom: 0;
      border-right: 1px solid rgba(255,255,255,0.06);
      z-index: 100;
    }
    .sidebar-avatar {
      width: 72px; height: 72px; border-radius: 50%;
      background: #2a2f4a; display: flex;
      align-items: center; justify-content: center; margin-bottom: 10px;
    }
    .sidebar-avatar svg { width: 44px; height: 44px; fill: #a0a8c0; }
    .sidebar-username { font-size: 14px; color: #c8cce0; margin-bottom: 40px; }
    .sidebar-nav {
      display: flex; flex-direction: column;
      gap: 8px; width: 100%; padding: 0 16px; flex: 1;
    }
    .sidebar-link {
      display: flex; align-items: center; gap: 14px;
      padding: 12px 16px; border-radius: 10px;
      color: #a0a8c0; text-decoration: none;
      font-size: 15px; font-weight: 500;
      transition: background 0.2s, color 0.2s;
    }
    .sidebar-link:hover, .sidebar-link.active {
      background: rgba(99,102,241,0.2); color: #fff;
    }
    .sidebar-link .icon {
      width: 34px; height: 34px; border-radius: 8px;
      background: #1e2240; display: flex;
      align-items: center; justify-content: center;
      font-size: 17px; flex-shrink: 0;
    }
    .sidebar-link:hover .icon, .sidebar-link.active .icon {
      background: rgba(99,102,241,0.3);
    }
    .sidebar-footer {
      font-size: 11px; color: #4a5070;
      margin-top: auto; padding: 16px; text-align: center;
    }
    .main-content {
      margin-left: 220px; flex: 1;
      min-height: 100vh; padding: 40px 48px;
    }
  </style>
  {% block extra_css %}{% endblock %}
</head>
<body>

  <aside class="sidebar">
    <a href="{% if user.is_authenticated %}{% url 'coordenador_home' %}{% else %}{% url 'login' %}{% endif %}" style="text-decoration:none; display:flex; flex-direction:column; align-items:center; margin-bottom:40px;">
      <div class="sidebar-avatar">
        <svg viewBox="0 0 24 24"><path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/></svg>
      </div>
      <span class="sidebar-username">{% if user.is_authenticated %}{{ user.username }}{% else %}Perfil{% endif %}</span>
    </a>

    <nav class="sidebar-nav">
      <a href="{% url 'home' %}" class="sidebar-link {% if request.resolver_match.url_name == 'home' %}active{% endif %}">
        <span class="icon">🏠</span>
        <span>Home</span>
      </a>
      <a href="{% url 'sobre' %}" class="sidebar-link {% if request.resolver_match.url_name == 'sobre' %}active{% endif %}">
        <span class="icon">❓</span>
        <span>Sobre</span>
      </a>
    </nav>

    <div class="sidebar-footer">desenvolvido por Cristian Bueno</div>
  </aside>

  <main class="main-content">
    {% block content %}{% endblock %}
  </main>

</body>
</html>
